name: 🚀 Deploy PaperLink to Cloudflare Workers

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  deploy:
    name: 🏗️ Build & Deploy
    runs-on: ubuntu-latest

    env:
      NAME: ${{ secrets.NAME || vars.NAME || 'paperlink' }}
      KV_NAMESPACE_ID: ${{ secrets.KV_NAMESPACE_ID || vars.KV_NAMESPACE_ID }}
      TURNSTILE_SITE_KEY: ${{ secrets.TURNSTILE_SITE_KEY || vars.TURNSTILE_SITE_KEY || '' }}
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

    steps:
      - name: 🚚 检出代码
        uses: actions/checkout@v4

      - name: ⚙️ 设置 Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: 📦 安装依赖
        run: npm install --no-audit --no-fund

      - name: 🛠️ 注入部署配置
        run: |
          CONFIG_FILE="wrangler-action.jsonc"

          if [ -z "$CLOUDFLARE_API_TOKEN" ] || [ -z "$CLOUDFLARE_ACCOUNT_ID" ]; then
            echo "::error::请在仓库 Secrets 中设置 CLOUDFLARE_API_TOKEN 与 CLOUDFLARE_ACCOUNT_ID"
            exit 1
          fi

          if [ -z "$KV_NAMESPACE_ID" ]; then
            echo "::warning::未设置 KV_NAMESPACE_ID —— 将保留线上已有绑定（含控制台手动绑定）；若线上也没有绑定，则以「未绑定 KV」模式部署"
            python3 - <<'EOF'
import json, re, urllib.request, os

token = os.environ["CLOUDFLARE_API_TOKEN"]
account = os.environ["CLOUDFLARE_ACCOUNT_ID"]
name = os.environ["NAME"]
path = "wrangler-action.jsonc"

s = open(path).read()

# 查询线上 Worker 现有绑定（含控制台手动绑的 KV / D1），避免部署整体覆盖丢失
kv, d1 = [], []
try:
    req = urllib.request.Request(
        f"https://api.cloudflare.com/client/v4/accounts/{account}/workers/scripts/{name}/settings",
        headers={"Authorization": f"Bearer {token}"})
    with urllib.request.urlopen(req, timeout=30) as r:
        data = json.load(r)
    for b in (data.get("result") or {}).get("bindings") or []:
        btype = b.get("type")
        if btype == "kv_namespace":
            kv.append({"binding": b.get("name"), "id": b.get("namespace_id") or b.get("id")})
        elif btype == "d1":
            d1.append({"binding": b.get("name"), "database_id": b.get("id")})
    print("::notice::线上已有绑定:", json.dumps({"kv": kv, "d1": d1}))
except Exception as e:
    print("::warning::读取线上绑定失败（首次部署属正常）:", e)

if kv:
    s = re.sub(r'"kv_namespaces":\s*\[[^\]]*\]',
               '"kv_namespaces": ' + json.dumps(kv), s, flags=re.S)
else:
    s = re.sub(r'"kv_namespaces":\s*\[[^\]]*\]', '"kv_namespaces": []', s, flags=re.S)
if d1:
    s = re.sub(r'"migrations":\s*\[', '"d1_databases": ' + json.dumps(d1) + ',\n  "migrations": [', s, count=1)
open(path, "w").write(s)
EOF
          else
            sed -i "s|\${KV_NAMESPACE_ID}|${KV_NAMESPACE_ID}|g" "$CONFIG_FILE"
          fi

          sed -i "s|\${NAME}|${NAME}|g" "$CONFIG_FILE"
          sed -i "s|\${TURNSTILE_SITE_KEY}|${TURNSTILE_SITE_KEY}|g" "$CONFIG_FILE"
          echo "✅ 配置注入完成"

      - name: 📡 禁用遥测并部署
        run: |
          npx wrangler telemetry disable || true
          npx wrangler deploy --config wrangler-action.jsonc

      - name: 📝 输出
        run: |
          echo "✅ 已部署 Worker：${NAME}"
          echo "👉 控制台绑定/Secrets：PL_JWT_SECRET、ADMIN_PASSWORD（务必修改，默认 paperlink2026）、SECRET_TURNSTILE（可选）"
