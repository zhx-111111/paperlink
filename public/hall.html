<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#e9e7f4">
<title>对话大厅 · PaperLink</title>
<link rel="manifest" href="/manifest.webmanifest">
<link rel="apple-touch-icon" sizes="180x180" href="/icons/icon-180-v2.png">
<link rel="icon" href="/icons/icon.svg" type="image/svg+xml">
<link rel="stylesheet" href="/css/paperlink.css">
</head>
<body class="input-page">

<div id="app-loading"><div class="ink-drop"></div><div class="loading-name gradient-text">PaperLink</div></div>

<!-- v3.5：canvas-ui Clouds 思路——墨云缓慢漂移氛围底 -->
<canvas id="hall-ambient" class="ambient-canvas"></canvas>

<!-- v3.80：天气彩蛋也落进大厅（与书写房共用确认偏好与天气缓存） -->
<canvas id="weather-canvas" aria-hidden="true"></canvas>

<!-- v3.93 FluidGlass：大厅玻璃底下的流动液体层 -->
<canvas id="hall-fluid" aria-hidden="true"></canvas>

<div class="hall-page">
  <div class="hall-top">
    <button class="header-btn" id="hall-back" title="返回" aria-label="返回"><span data-icon="back" data-size="18"></span></button>
    <h1><span data-icon="book" data-size="20"></span> 对话大厅</h1>
    <!-- v3.54：邀请码输入同享靠近聚焦（镜像层按本框尺寸适配） -->
    <div class="code-wrap" id="hall-search-wrap">
      <input id="hall-search" type="text" placeholder="请输入 9 位邀请码" maxlength="9" autocomplete="off" style="text-transform:uppercase">
      <div class="code-mirror upper hall-fit" id="hall-code-mirror" aria-hidden="true"></div>
    </div>
    <div class="hall-actions">
      <button class="small-btn" id="btn-create"><span data-icon="userPlus" data-size="15"></span> 新对话</button>
      <button class="small-btn ghost" id="btn-join">加入</button>
    </div>
  </div>

  <div class="bookshelf" id="bookshelf"></div>
  <div class="hall-empty hidden" id="hall-empty">
    书架还空着。<br>
    点「新对话」创建一本，把邀请码交给 TA；<br>
    或在上方输入 9 位邀请码，加入 TA 的日记本。
  </div>
</div>

<!-- 卡片菜单 -->
<div id="card-menu" class="hidden">
  <button id="menu-rename"><span data-icon="edit" data-size="14"></span> 重命名</button>
  <button id="menu-invite"><span data-icon="copy" data-size="14"></span> 复制邀请码</button>
  <button id="menu-delete" class="danger"><span data-icon="trash" data-size="14"></span> 删除对话</button>
</div>

<!-- 创建对话命名弹层 -->
<div id="theme-popup" class="hidden">
  <div class="popup-card" style="width:min(92vw,360px)">
    <h3 id="dlg-title">给这本日记起个名字</h3>
    <div class="field" style="margin-top:8px">
      <input id="dlg-name" type="text" maxlength="24" placeholder="留空则自动命名（对话1~5）">
    </div>
    <div class="actions" style="justify-content:flex-end">
      <button class="small-btn ghost" id="dlg-cancel">取消</button>
      <button class="small-btn" id="dlg-ok">创建</button>
    </div>
  </div>
</div>

<div id="toast"></div>
<script type="module" src="/js/hall.js"></script>
</body>
</html>
