<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#e9e7f4">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="PaperLink">
<title>PaperLink</title>
<!-- v4.16 社交分享卡片（Open Graph）：微信/QQ 等抓取 head 生成图文卡片 -->
<meta name="description" content="落笔即见的实时镜像、会翻页的信纸与书信集。写满一页寄出去，就是一封真正的手写信。">
<meta property="og:type" content="website">
<meta property="og:title" content="PaperLink · 书写房：与 TA 同写一张纸">
<meta property="og:description" content="落笔即见的实时镜像、会翻页的信纸与书信集。写满一页寄出去，就是一封真正的手写信。">
<meta property="og:image" content="https://zh666.de5.net/og/cover-478.png">
<meta property="og:url" content="https://zh666.de5.net/room">
<link rel="manifest" href="/manifest.webmanifest">
<link rel="apple-touch-icon" sizes="180x180" href="/icons/icon-180-v2.png">
<link rel="icon" href="/icons/icon.svg" type="image/svg+xml">
<link rel="preload" href="/fonts/DancingScript.ttf" as="font" type="font/ttf" crossorigin>
<link rel="stylesheet" href="/css/paperlink.css">
</head>
<body class="room-body">

<!-- v4.23 分页加载动画：书写房 = 羽笔写线 -->
<div id="app-loading" class="loader-quill">
  <svg class="quill" viewBox="0 0 116 44" aria-hidden="true">
    <path class="quill-line" d="M8 32 C 30 8, 52 36, 74 16 S 100 24, 108 12"/>
    <circle class="quill-nib" r="3"/>
  </svg>
  <div class="loading-name gradient-text">PaperLink</div>
</div>

<svg style="position:absolute;width:0;height:0;overflow:hidden" aria-hidden="true" xmlns="http://www.w3.org/2000/svg">
  <symbol id="pl-icon" viewBox="0 0 120 120">
    <defs>
      <linearGradient id="plIg" x1="0" y1="0" x2="1" y2="1">
        <stop offset="0" stop-color="#8ee6c4"/>
        <stop offset="1" stop-color="#4fb9e8"/>
      </linearGradient>
    </defs>
    <rect x="2" y="2" width="116" height="116" rx="27" fill="url(#plIg)"/>
    <g fill="none" stroke="#fff" stroke-width="4.5" stroke-linecap="round" stroke-linejoin="round">
      <path d="M60 40 C 50 32, 34 30, 24 33 L 24 86 C 34 83, 50 85, 60 92 C 70 85, 86 83, 96 86 L 96 33 C 86 30, 70 32, 60 40 Z"/>
      <path d="M60 40 L 60 92"/>
      <path d="M60 40 C 62 30, 70 20, 82 14"/>
      <path d="M82 14 C 72 15, 64 22, 61 32"/>
      <path d="M32 50 C 38 47, 46 48, 52 52" stroke-width="3" opacity="0.9"/>
      <path d="M32 62 C 40 59, 47 60, 52 63" stroke-width="3" opacity="0.65"/>
      <path d="M68 52 C 74 48, 82 47, 88 50" stroke-width="3" opacity="0.9"/>
      <path d="M68 63 C 73 60, 80 59, 88 62" stroke-width="3" opacity="0.65"/>
    </g>
    <circle cx="88" cy="74" r="4" fill="#fff" opacity="0.9"/>
  </symbol>
</svg>

<!-- 页首：图标 / 大厅 / 邀请码 / 头像 -->
<div id="page-header">
  <div id="page-icon" title="PaperLink"><svg><use href="#pl-icon"/></svg></div>
  <span id="page-title">PaperLink</span>
  <button id="btn-hall" class="header-btn" title="对话大厅" aria-label="对话大厅"><span data-icon="hall"></span></button>
  <div id="invite-chip" class="hidden" title="点击复制邀请码">邀请码：<b id="invite-code"></b></div>
  <button id="btn-me" class="avatar" title="我的" aria-label="账户面板"></button>
</div>

<!-- 对方在线状态 -->
<div id="partner-badge" class="hidden">
  <span class="avatar" id="partner-avatar" style="width:22px;height:22px;border-width:1px;"></span>
  <span id="partner-name">…</span>
  <span id="partner-status"></span>
  <span class="dot"></span>
</div>

<!-- 等待横幅 5 秒后缩小成的迷你挂饰（固定在「我的」下方，点一点复制邀请码） -->
<div id="partner-mini" class="hidden">
  <span class="avatar" id="partner-mini-avatar" style="width:28px;height:28px;border-width:1px;"></span>
  <span class="dot"></span>
</div>

<!-- v3.31：断线轻提示——断线重连期间顶部常驻小胶囊，连上自动消失 -->
<div id="conn-pill" class="hidden"><span class="conn-dot"></span>连接已断开，正在重新连接…</div>

<!-- v3.58：TA 在写信——对方落笔时轻轻亮起，停笔后悄悄淡出 -->
<div id="writing-pill" aria-live="polite"><span class="wp-pen" data-icon="pen" data-size="14"></span>TA 在写信<span class="wp-dots"><i></i><i></i><i></i></span></div>

<!-- 书写区 -->
<div id="stage">
  <!-- v3.16 #1：主题氛围字符雨（字符集随信纸主题切换；音乐歌词出现时停用） -->
  <canvas id="room-ambient" aria-hidden="true"></canvas>
  <div id="desk">
    <div id="paper" class="page-paper texture-parchment">
      <canvas id="ink-canvas"></canvas>
      <!-- v4.1 #11：对端实时笔迹预览独立层（与主画布隔离，修复镜像丢笔/重影） -->
      <canvas id="live-canvas"></canvas>
      <!-- v4.50 iOS 笔迹预测层：WebKit 前瞻采样点先画这里，真迹一到即清（只看不摸） -->
      <canvas id="predict-canvas" aria-hidden="true"></canvas>
      <canvas id="fx-canvas"></canvas>
      <div id="partner-cursor"></div>
      <div id="eraser-ring"></div>
    </div>
  </div>
</div>

<!-- 主题栏：riddle 式同心圆（外环=信纸色，内心=笔迹色），只显示拥有的 -->
<div id="theme-bar"></div>

<!-- 主题选择弹层 -->
<div id="theme-popup" class="hidden">
  <div class="popup-card">
    <h3>选择信纸</h3>
    <div class="grid" id="theme-grid"></div>
  </div>
</div>

<!-- v4.42 白笺（E9）墨盘弹层：30 色（26 纯色 + 3 渐变 + 默认墨色），管理页可整盘替换 -->
<div id="blanc-popup" class="hidden">
  <div class="popup-card">
    <h3>选择墨色</h3>
    <div class="grid" id="blanc-grid"></div>
  </div>
</div>

<!-- 橡皮大小滑条（长按橡皮弹出） -->
<div id="eraser-pop" class="hidden">
  <!-- v4.50 橡皮模式：涂抹（像素橡皮）/ 整笔（点哪笔删哪笔） -->
  <div id="eraser-mode" role="group" aria-label="橡皮模式">
    <button type="button" id="eraser-mode-pixel" class="on">涂抹</button>
    <button type="button" id="eraser-mode-stroke">整笔</button>
  </div>
  <span data-icon="eraser" data-size="15"></span>
  <input id="eraser-range" type="range" min="8" max="120" value="18" aria-label="橡皮大小">
</div>

<!-- v3.15 出锋长度滑条（长按自动出锋按钮弹出） -->
<div id="tip-pop" class="hidden">
  <span data-icon="tip" data-size="15"></span>
  <input id="tip-range" type="range" min="2" max="40" value="8" aria-label="出锋长度">
</div>

<!-- v4.1 #22 笔迹粗细滑条（轻点粗细按钮弹出，贴按钮旁） -->
<div id="width-pop" class="hidden">
  <span data-icon="penWidth" data-size="15"></span>
  <input id="width-range" type="range" min="0.5" max="6" step="0.1" value="1" aria-label="笔迹粗细">
  <output id="width-out">1.0x</output>
</div>

<!-- v4.62 平滑度滑条（长按平滑按钮弹出，贴按钮旁） -->
<div id="smooth-pop" class="hidden">
  <span data-icon="smooth" data-size="15"></span>
  <input id="smooth-range" type="range" min="0.1" max="0.8" step="0.05" value="0.35" aria-label="笔迹平滑度">
  <output id="smooth-out">0.35</output>
</div>

<!-- 右下浮动工具栏 -->
<div id="toolbar">
  <button id="btn-eraser" class="tool-btn" title="橡皮（长按调大小）" aria-label="橡皮"><span data-icon="eraser"></span></button>
  <button id="btn-tip" class="tool-btn" title="自动出锋（轻点开关 · 长按调长度）" aria-label="自动出锋"><span data-icon="tip"></span></button>
  <!-- v4.1 #22：笔迹粗细（与首页体验板同款，本机记忆共享） -->
  <button id="btn-width" class="tool-btn" title="笔迹粗细（0.5x–6x）" aria-label="笔迹粗细"><span data-icon="penWidth"></span></button>
  <!-- v4.62：平滑度（轻点开关 · 长按滑条调值） -->
  <button id="btn-smooth" class="tool-btn" title="笔迹平滑（轻点开关 · 长按调平滑度）" aria-label="笔迹平滑"><span data-icon="smooth"></span></button>
  <button id="btn-undo" class="tool-btn" title="撤销上一笔" aria-label="撤销"><span data-icon="undo"></span></button>
  <button id="btn-redo" class="tool-btn" title="重做（把撤销的一笔放回）" aria-label="重做"><span data-icon="redo"></span></button>
  <button id="btn-export" class="tool-btn" title="把这页存成图片" aria-label="存为图片"><span data-icon="download"></span></button>
  <button id="btn-clear" class="tool-btn danger" title="清空整页（双方同步）" aria-label="清空整页"><span data-icon="trash"></span></button>
  <button id="btn-fullscreen" class="tool-btn" title="全屏" aria-label="全屏">
    <span class="ic-expand" data-icon="expand"></span>
    <span class="ic-compress hidden" data-icon="compress"></span>
  </button>
  <button id="btn-landscape" class="tool-btn fs-only" title="横屏" aria-label="横屏"><span data-icon="landscape"></span></button>
  <button id="btn-music" class="tool-btn hidden" title="音乐（实验）" aria-label="音乐"><span data-icon="music"></span></button>
  <button id="btn-fade" class="tool-btn" title="隐藏界面（再点恢复）" aria-label="隐藏界面"><span data-icon="fade"></span></button>
  <!-- v4.50：实时语音（P2P，彩蛋 VC 解锁后显示），位于实时镜像按钮上方 -->
  <button id="btn-voice" class="tool-btn hidden" title="语音通话（实验）" aria-label="语音通话"><span data-icon="phone"></span></button>
  <button id="btn-mode" class="tool-btn hidden" title="切换 实时镜像 / 寄信模式" aria-label="切换模式"><span data-icon="mode"></span></button>
</div>

<!-- v3.7：视口一键复位浮动按钮（轻点复位画面缩放/位置；v4.50 长按跳到对方落笔处） -->
<button id="btn-reset-view" class="float-btn" title="视口复位（轻点复位 · 长按跳到对方书写处 · 拖动挪位）" aria-label="视口复位"><span data-icon="resetView" data-size="18"></span></button>

<!-- v4.42 白笺墨色按钮：仅「白笺」信纸时可见（轻点弹墨盘 · 拖动挪位），默认落在书信集上方 -->
<button id="btn-blanc-ink" class="float-btn hidden" title="墨色（轻点选色 · 拖动挪位）" aria-label="墨色"><span class="blanc-dot" id="blanc-dot"></span></button>

<!-- 寄信模式发送栏 -->
<div id="send-bar" class="hidden">
  <!-- v3.91 FluidGlass：寄出栏毛玻璃下的流动液体层 -->
  <canvas id="send-bar-fluid" aria-hidden="true"></canvas>
  <button class="cancel-btn" id="send-cancel">取消</button>
  <!-- v3.39：按钮内文字加底层饱满度细线（写了多满一眼可见） -->
  <button class="send-btn" id="send-go" disabled><span class="send-label">发送</span><span class="send-meter" id="send-meter"></span></button>
</div>

<!-- 书信集 -->
<!-- v4.27：实时镜像且双方同页时，屏幕四边亮起淡蓝/天青/柠檬黄渐变光晕 -->
<div id="same-page-glow" aria-hidden="true"></div>

<!-- v4.25：右下角横排翻页器（圆角矩形）：上一页 / 页码 / 下一页（末页再点 = 新的一页） -->
<div id="pager">
  <button id="pager-prev" class="pager-btn" title="上一页" aria-label="上一页"><span data-icon="back"></span></button>
  <span id="pager-label" class="pager-label">1/1</span>
  <button id="pager-next" class="pager-btn" title="下一页（末页再点 = 新的一页）" aria-label="下一页"><span data-icon="next"></span></button>
</div>

<button id="btn-letters" class="tool-btn" title="书信集" aria-label="书信集">
  <span data-icon="letters"></span>
  <span class="badge hidden" id="letter-badge">0</span>
</button>

<div id="letter-drawer">
  <div class="drawer-head">
    <h3 id="drawer-title">书信集</h3>
    <div class="drawer-head-btns">
      <button class="mini-btn" id="drawer-export" title="勾选信件拼成一张长图导出"><span data-icon="download" data-size="14"></span> 导出</button>
      <button class="mini-btn" id="drawer-fav-filter" title="只显示收藏的信"><span data-icon="star" data-size="14"></span> 只看收藏</button>
      <button class="mini-btn" id="drawer-close">收起</button>
    </div>
  </div>
  <div id="letter-export-bar" class="hidden">
    <span class="leb-tip">勾选要导出的信</span>
    <button class="mini-btn" id="lexport-all">全选</button>
    <button class="mini-btn" id="lexport-cancel">取消</button>
    <button class="small-btn" id="lexport-go" disabled>导出</button>
    <button class="mini-btn" id="lexport-pdf" disabled title="每封信一页，转成 PDF 文件">PDF</button>
  </div>
  <div class="list" id="letter-list"></div>
</div>

<!-- 信件重放（全屏 / 按对方比例尽量最大化） -->
<div id="letter-overlay" class="hidden">
  <!-- v3.5：canvas-ui Celebrate/ParticleReveal 思路——开信一刻的墨粒迸发 -->
  <canvas id="burst-canvas"></canvas>
  <div class="overlay-paper" id="overlay-paper">
    <div class="letter-head">
      <span class="avatar" id="overlay-avatar" style="width:24px;height:24px;border-width:1px;"></span>
      <span id="overlay-who"></span>
    </div>
    <button class="close-x" id="overlay-close" aria-label="关闭"><span data-icon="close" data-size="15"></span></button>
    <canvas id="overlay-canvas"></canvas>
    <!-- v3.81：轻点信纸暂停/继续时，中央浮个小图标说明一下 -->
    <div id="ov-tap-flash" aria-hidden="true"></div>
    <div class="overlay-controls">
      <!-- v3.70：重放层里连读——上一封 / 下一封（←/→ 也能翻） -->
      <button class="mini-btn" id="overlay-prev" title="上一封（←）" aria-label="上一封"><span data-icon="back" data-size="14"></span></button>
      <button class="mini-btn" id="overlay-pause" aria-label="暂停/继续"></button>
      <button class="mini-btn" id="overlay-replay" aria-label="重播"><span data-icon="refresh" data-size="14"></span></button>
      <!-- v3.76：循环播放开关（开 = 播完自动从头再来） -->
      <button class="mini-btn" id="overlay-loop" aria-label="循环播放" aria-pressed="false"><span data-icon="repeat" data-size="14"></span></button>
      <!-- v3.23 #18：播放倍速（0.5x/1x/1.5x/2x 循环切换） -->
      <button class="mini-btn" id="overlay-speed" aria-label="播放倍速">1x</button>
      <button class="mini-btn" id="overlay-next" title="下一封（→）" aria-label="下一封"><span data-icon="forward" data-size="14"></span></button>
      <!-- v3.23 #31：重放进度条 + 笔画计数 -->
      <div class="overlay-progress" role="slider" aria-label="播放进度（可拖动）" title="拖动跳转"><div class="overlay-progress-fill" id="ov-progress-fill"></div></div>
      <span class="ov-count" id="ov-count"></span>
    </div>
    <!-- v4.64 倍速选择条：轻点倍速按钮弹出——预设一点即定，滑条/数字输入自定义 -->
    <div id="ov-speed-pop" class="hidden">
      <div class="ov-sp-chips">
        <button type="button" data-sp="0.5">0.5x</button>
        <button type="button" data-sp="0.75">0.75x</button>
        <button type="button" data-sp="1">1x</button>
        <button type="button" data-sp="2">2x</button>
        <button type="button" data-sp="3">3x</button>
      </div>
      <div class="ov-sp-custom">
        <input id="ov-speed-range" type="range" min="0.1" max="10" step="0.1" value="1" aria-label="自定义倍速">
        <input id="ov-speed-num" type="number" min="0.01" max="10" step="0.01" value="1" aria-label="精确倍速">
        <span class="ov-sp-x">x</span>
      </div>
    </div>
  </div>
  <!-- v3.83：第一次看信的手势提示（只露一次，点按即退） -->
  <div id="ov-gesture-tip" class="hidden" aria-hidden="true">轻点信纸暂停 / 继续 · 左右滑动翻信</div>
</div>

<!-- v4.34 修复：这枚浮提示此前被误放在信件重放弹层里面——弹层不打开时它跟着
     display:none，书写房双指缩放就永远看不到百分比。挪到弹层外、与弹层平级。 -->
<div id="zoom-hud" class="hidden" aria-hidden="true">100%</div>

<!-- 音乐面板（实验功能：网易云搜歌播放） -->
<div id="music-pop" class="hidden">
  <div class="popup-card">
    <h3>音乐 · 实验功能</h3>
    <div class="music-search">
      <input id="music-q" type="text" placeholder="搜一首歌，边写边听" maxlength="60" autocomplete="off">
      <button class="small-btn" id="music-search-btn">搜索</button>
    </div>
    <div id="music-list"></div>
    <div id="music-now">未在播放</div>
    <div class="actions" style="justify-content:flex-end">
      <button class="mini-btn" id="music-close">收起</button>
    </div>
  </div>
</div>

<!-- v3.16 #16：墨焰仪式层（寄信成功 / 对方读信瞬间的短促火焰粒子） -->
<canvas id="blaze-canvas" aria-hidden="true"></canvas>

<!-- v3.18：天气彩蛋层（访客本地下雨/雪时，雨滴/雪花沿屏幕流下） -->
<canvas id="weather-canvas" aria-hidden="true"></canvas>
<!-- v4.43 天气沉浸：闲置时水滴沿"玻璃"滑落的第二层（全设备 2D 实现） -->
<canvas id="weather-drops-canvas" aria-hidden="true"></canvas>

<!-- 新信横幅 -->
<div id="new-letter-banner" class="hidden">
  <span id="banner-text">对方寄来一页新信</span>
  <button id="banner-view">现在查看</button>
</div>

<div id="toast"></div>

<!-- v4.50 沉浸书写：界面淡出后，点屏幕上下边缘这两条隐形区唤回 -->
<div id="immersive-edge-top" aria-hidden="true"></div>
<div id="immersive-edge-bottom" aria-hidden="true"></div>

<script type="module" src="/js/room.js"></script>
</body>
</html>
